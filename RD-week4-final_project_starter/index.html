<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dự án Thư viện ảnh</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Bộ sưu tập Màu sắc</h1>
  </header>

  <main>
    <section id="gallery">
      <h2>Danh sách hình ảnh</h2>
      <div class="grid">
        <figure>
          <img src="images/Red.jpeg" alt="Màu đỏ">
          <figcaption>Màu Đỏ</figcaption>
        </figure>
        <figure>
          <img src="images/Blue.png" alt="Màu xanh dương">
          <figcaption>Màu Xanh Dương</figcaption>
        </figure>
        <figure>
          <img src="images/Green.png" alt="Màu xanh lá">
          <figcaption>Màu Xanh Lá</figcaption>
        </figure>
        <figure>
          <img src="images/Yellow.png" alt="Màu vàng">
          <figcaption>Màu Vàng</figcaption>
        </figure>
        <figure>
          <img src="images/Orange.png" alt="Màu cam">
          <figcaption>Màu Cam</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Bản quyền thuộc về ThanhNha07</p>
  </footer>

</body>
</html>
